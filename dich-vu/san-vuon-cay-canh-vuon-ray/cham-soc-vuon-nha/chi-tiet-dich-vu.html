<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi Tiết Dịch Vụ - Chăm Sóc Vườn Nhà</title>
    <link rel="shortcut icon" type="image/x-icon" href="assets/images/logo2.jpg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --primary-green: #1a4d2e;
            --accent-green: #4f6f52;
            --soft-lime: #e8f3d6;
            --nature-white: #f9fbf9;
            --glass: rgba(255, 255, 255, 0.92);
            --shadow-sm: 0 4px 20px rgba(26, 77, 46, 0.06);
            --shadow-lg: 0 20px 50px rgba(26, 77, 46, 0.12);
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        body {
            font-family: "Quicksand", sans-serif;
            background-color: var(--nature-white);
            color: #2d3436;
            overflow-x: hidden;
            padding-top: 0;
        }

        /* ── HERO BANNER ── */
        .page-banner {
            background: radial-gradient(circle at 80% 20%, #c8e6b0 0%, #eaf5e0 40%, #f5fbf0 70%, #ffffff 100%);
            padding: 60px 0 90px;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .page-banner::before {
            content: "Details";
            position: absolute;
            font-family: 'Playfair Display', serif;
            font-size: 18vw;
            font-weight: 900;
            color: rgba(26, 77, 46, 0.06);
            top: 50%;
            left: -2%;
            transform: translateY(-50%);
            z-index: 0;
            pointer-events: none;
            white-space: nowrap;
        }

        .page-banner h2 {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: var(--primary-green);
            font-size: 3.8rem;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -1px;
            margin-bottom: 0;
            position: relative;
            z-index: 1;
        }

        .page-banner .lead-sub {
            font-size: 1.2rem;
            color: #636e72;
            font-weight: 600;
            position: relative;
            z-index: 1;
        }

        .page-banner .custom-underline {
            width: 120px;
            height: 5px;
            background: var(--primary-green);
            margin: 20px auto 0;
            border-radius: 50px;
        }

        .breadcrumb-item a { color: var(--accent-green) !important; font-weight: 600; }
        .breadcrumb-item.active { color: var(--primary-green); font-weight: 700; }

        /* ── PROGRESS BAR ── */
        .progress-container { position: fixed; top: 0; left: 0; width: 100%; height: 5px; background: transparent; z-index: 9999; }
        .progress-bar-scroll { height: 5px; background: var(--primary-green); width: 0%; transition: width 0.1s; }
        .img-wrapper {
            position: relative;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            margin-bottom: 32px;
            background: #e8f3d6;
        }

        .service-header-img {
            width: 100%;
            height: 460px;
            object-fit: cover;
            transition: var(--transition);
            display: block;
        }

        .img-wrapper:hover .service-header-img {
            transform: scale(1.04);
        }

        /* ── META BADGES ── */
        .meta-badge {
            background: #fff;
            padding: 8px 16px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.82rem;
            box-shadow: var(--shadow-sm);
            display: inline-flex;
            align-items: center;
            gap: 7px;
            border: 1px solid rgba(26, 77, 46, 0.1);
            color: var(--primary-green);
        }

        .meta-badge i.fa-star { color: #f59e0b; }
        .meta-badge i.fa-clock { color: var(--accent-green); }
        .meta-badge i.fa-shield-alt { color: var(--primary-green); }

        /* ── TAGS ── */
        .tag-item {
            display: inline-block;
            padding: 5px 14px;
            background: var(--soft-lime);
            color: var(--primary-green);
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.78rem;
            margin: 0 6px 8px 0;
            border: 1px solid rgba(26, 77, 46, 0.12);
        }

        /* ── SECTION TITLE ── */
        .section-title {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            position: relative;
            padding-bottom: 12px;
            margin-bottom: 20px;
            color: var(--primary-green);
            font-size: 1.3rem;
        }

        .section-title::after {
            content: "";
            position: absolute;
            bottom: 0; left: 0;
            width: 36px; height: 3px;
            background: var(--accent-green);
            border-radius: 2px;
        }

        /* ── INFO CARD (cột phải) ── */
        .info-card {
            background: #fff;
            border: 1px solid rgba(26, 77, 46, 0.1);
            border-radius: 32px;
            padding: 32px;
            box-shadow: var(--shadow-lg);
            position: sticky;
            top: 110px;
        }

        /* ── PRICE DISPLAY ── */
        .price-display {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--accent-green) 100%);
            color: white;
            padding: 24px 20px;
            border-radius: 22px;
            margin-bottom: 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .price-display::before {
            content: "₫";
            position: absolute;
            right: -10px; top: -10px;
            font-size: 6rem;
            font-weight: 900;
            opacity: 0.06;
            line-height: 1;
        }

        .price-display h3 {
            font-size: 1.6rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.5px;
        }

        /* ── SPEC LIST ── */
        .spec-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(26, 77, 46, 0.07);
            font-size: 0.9rem;
        }

        .spec-list li:last-child { border-bottom: none; }
        .spec-list .spec-label { color: #636e72; font-weight: 600; }
        .spec-list .spec-val { font-weight: 700; color: var(--primary-green); }

        /* ── PRICE NOTE ── */
        .price-note-box {
            background: var(--soft-lime);
            border: 1px solid rgba(26, 77, 46, 0.12);
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 0.85rem;
            color: var(--primary-green);
            margin-bottom: 20px;
        }

        /* ── BOOK BUTTON ── */
        .btn-book-now {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--accent-green) 100%);
            color: white !important;
            border: none;
            padding: 16px;
            border-radius: 18px;
            font-weight: 800;
            font-size: 1rem;
            width: 100%;
            transition: var(--transition);
            box-shadow: 0 8px 24px rgba(26, 77, 46, 0.25);
            letter-spacing: 0.5px;
        }

        .btn-book-now:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 32px rgba(26, 77, 46, 0.35);
        }

        /* ── HOTLINE BOX ── */
        .hotline-box {
            background: var(--nature-white);
            border: 1px solid rgba(26, 77, 46, 0.08);
            border-radius: 16px;
            padding: 14px 16px;
            text-align: center;
            margin-top: 16px;
        }

        /* ── INFO BOXES (khu vực / phân loại) ── */
        .info-box {
            background: #fff;
            border: 1px solid rgba(26, 77, 46, 0.1);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow-sm);
            height: 100%;
            transition: var(--transition);
        }

        .info-box:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .info-box h5 {
            color: var(--primary-green);
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        /* ── MODAL ── */
        .modal-content {
            border-radius: 32px;
            border: none;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(26, 77, 46, 0.2);
        }

        .modal-header {
            border-bottom: 1px solid rgba(26, 77, 46, 0.08);
            padding: 18px 28px;
            background: linear-gradient(135deg, var(--soft-lime) 0%, #fff 100%);
            position: relative;
        }

        .modal-title-custom {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            width: 100%;
        }

        .modal-logo {
            width: 34px; height: 34px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(26, 77, 46, 0.15);
        }

        .modal-title-text {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: var(--primary-green);
            font-size: 1.3rem;
            margin: 0;
            letter-spacing: 0.5px;
        }

        .modal-header .btn-close {
            position: absolute;
            right: 28px;
            top: 50%;
            transform: translateY(-50%);
            margin: 0;
        }

        #bookingFlowFrame {
            width: 100%;
            height: 75vh;
            border: 0;
            display: block;
        }

        /* ── SPINNER ── */
        .spinner-grow {
            width: 2.5rem; height: 2.5rem;
            color: var(--primary-green) !important;
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 991.98px) {
            .page-banner h2 { font-size: 2.4rem; }
            .page-banner { padding: 40px 0 50px; }
            .info-card { position: static; border-radius: 24px; padding: 24px; }
            .service-header-img { height: 300px; }
        }

        @media (max-width: 575.98px) {
            .page-banner h2 { font-size: 2rem; }
            .img-wrapper { border-radius: 20px; }
            .service-header-img { height: 240px; }
        }
    </style>
</head>

<body>
    <div class="progress-container"><div class="progress-bar-scroll" id="scrollProgress"></div></div>

    <div id="site-header"></div>

    <section class="page-banner">
        <div class="container position-relative" style="z-index:1;">
            <nav aria-label="breadcrumb" style="position:relative;z-index:1;">
                <ol class="breadcrumb justify-content-center mb-3">
                    <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none fw-bold" style="color:var(--accent-green)">Trang chủ</a></li>
                    <li class="breadcrumb-item"><a href="dich-vu.html" class="text-decoration-none fw-bold" style="color:var(--accent-green)">Dịch vụ</a></li>
                    <li class="breadcrumb-item active fw-bold" style="color:var(--primary-green)">Chi tiết</li>
                </ol>
            </nav>
            <h2 class="fw-bold">Chi Tiết <span style="color: var(--accent-green)">Dịch Vụ</span></h2>
            <p class="lead-sub mt-3 mb-0">Thông tin chi tiết và báo giá dịch vụ chăm sóc vườn nhà</p>
            <div class="custom-underline"></div>
        </div>
    </section>

    <main class="py-4">
        <div class="container mb-3 pb-3" id="detailContainer">
            <div class="text-center py-5">
                <div class="spinner-grow" role="status"></div>
                <p class="mt-4 text-muted fw-bold">Đang tải dữ liệu từ vườn nhà...</p>
            </div>
        </div>
    </main>

    <!-- SECTION: CÁC DỊCH VỤ KHÁC -->
    <section id="other-services-section" class="py-4" style="background: linear-gradient(180deg, #f9fbf9 0%, #ffffff 100%);">
      <div class="container py-2">
        <div class="d-flex justify-content-between align-items-end mb-4">
          <div>
            <span style="font-size:0.8rem;font-weight:700;color:#4f6f52;text-transform:uppercase;letter-spacing:3px;">
              <i class="fas fa-leaf me-2"></i>Cùng danh mục
            </span>
            <h2 class="fw-bold mb-0 mt-2" style="color:var(--primary-green);font-family:'Playfair Display',serif;font-size:2rem;">Dịch Vụ Khác</h2>
            <div style="width:50px;height:3px;background:var(--accent-green);border-radius:10px;margin-top:10px;"></div>
          </div>
          <a href="dich-vu.html" class="btn rounded-pill fw-bold px-4 py-2 d-none d-md-inline-flex align-items-center gap-2"
            style="background:var(--soft-lime);color:var(--primary-green);border:1px solid rgba(26,77,46,0.15);font-size:0.9rem;">
            Xem tất cả <i class="fas fa-arrow-right"></i>
          </a>
        </div>
        <div class="row g-4" id="other-services-grid"></div>
      </div>
    </section>

    <div id="site-footer"></div>

    <div class="modal fade" id="bookingFlowModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content shadow-lg">
                <div class="modal-header">
                    <div class="modal-title-custom">
                        <img src="assets/images/logo1.png" alt="Logo" class="modal-logo">
                        <h5 class="modal-title-text">ĐẶT LỊCH DỊCH VỤ</h5>
                        <img src="assets/images/logo2.jpg" alt="Logo" class="modal-logo">
                    </div>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0">
                    <iframe id="bookingFlowFrame" src="about:blank"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="JS/api-client.js"></script>

    <script>
        $(document).ready(async function() {
            $("#site-header").load("html/shared-header.html");
            $("#site-footer").load("html/shared-footer.html");

            const urlParams = new URLSearchParams(window.location.search);
            const serviceId = urlParams.get('id');
            const bookingModal = new bootstrap.Modal('#bookingFlowModal');

            if (!serviceId) {
                $('#detailContainer').html('<div class="text-center py-5"><h3>ID dịch vụ không hợp lệ</h3><a href="dich-vu.html" class="btn btn-success rounded-pill px-4 mt-3">Quay lại danh sách</a></div>');
                return;
            }

            try {
                const services = await API.getServices();
                const item = services.find(s => s.id == serviceId);

                if (!item) {
                    $('#detailContainer').html('<div class="text-center py-5"><h3>Rất tiếc, dịch vụ không tồn tại</h3></div>');
                    return;
                }

                const tagsHTML = item.tags.map(t => `<span class="tag-item">#${t}</span>`).join('');

                $('#detailContainer').html(`
                    <div class="row g-lg-5">
                        <div class="col-lg-8">
                            <div class="img-wrapper">
                                <img src="assets/images/${item.image}" class="service-header-img" alt="${item.name}" onerror="this.src='assets/images/vuon-nha-dep.png'">
                            </div>

                            <div class="d-flex flex-wrap gap-2 mb-4">
                                <div class="meta-badge"><i class="fas fa-star"></i> ${item.rating} <span class="text-muted fw-normal">(${item.total_reviews} đánh giá)</span></div>
                                <div class="meta-badge"><i class="fas fa-clock"></i> ${item.duration_estimate}</div>
                                <div class="meta-badge"><i class="fas fa-shield-alt"></i> Bảo hành 7 ngày</div>
                            </div>

                            <h1 class="fw-bold mb-3" style="font-family: 'Playfair Display', serif; color: var(--primary-green); font-size: clamp(1.6rem, 3vw, 2.4rem);">${item.name}</h1>

                            <div class="service-description mb-5">
                                <h4 class="section-title">Chi tiết dịch vụ</h4>
                                <div class="lh-lg" style="font-size: 1.05rem; color: #4a5568; text-align: justify;">
                                    ${item.description}
                                </div>
                            </div>

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <div class="info-box">
                                        <h5><i class="fas fa-map-marked-alt me-2" style="color:var(--accent-green)"></i>Khu vực phục vụ</h5>
                                        <p class="text-muted mb-0 small">${item.service_area || 'Toàn thành phố'}</p>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="info-box">
                                        <h5><i class="fas fa-tags me-2" style="color:var(--accent-green)"></i>Phân loại dịch vụ</h5>
                                        <div>${tagsHTML}</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-lg-4">
                            <div class="info-card">
                                <h5 class="fw-bold mb-4 text-center" style="font-family: 'Playfair Display', serif; color: var(--primary-green); font-size: 1.2rem;">
                                    <i class="fas fa-leaf me-2" style="color:var(--accent-green)"></i>Báo Giá Dự Kiến
                                </h5>

                                <div class="price-display shadow-sm">
                                    <p class="small mb-1 opacity-80">Đơn giá tham khảo</p>
                                    <h3>${item.price_m2_min.toLocaleString()}đ – ${item.price_m2_max.toLocaleString()}đ</h3>
                                    <p class="small mt-2 mb-0 opacity-80">Đơn vị: ${item.area_unit}</p>
                                </div>

                                <ul class="list-unstyled spec-list mb-4">
                                    <li>
                                        <span class="spec-label"><i class="fas fa-layer-group me-1"></i>Độ khó</span>
                                        <span class="spec-val">${item.difficulty_level || 'Cơ bản'}</span>
                                    </li>
                                    <li>
                                        <span class="spec-label"><i class="fas fa-clock me-1"></i>Thời gian</span>
                                        <span class="spec-val">${item.duration_estimate}</span>
                                    </li>
                                    <li>
                                        <span class="spec-label"><i class="fas fa-star me-1"></i>Đánh giá</span>
                                        <span class="spec-val">${item.rating}/5 ⭐</span>
                                    </li>
                                </ul>

                                <div class="price-note-box">
                                    <i class="fas fa-info-circle me-2"></i>${item.price_note || 'Giá thực tế dựa trên khảo sát hiện trạng.'}
                                </div>

                                <button class="btn btn-book-now" id="openBooking">
                                    <i class="fas fa-calendar-check me-2"></i>ĐẶT LỊCH NGAY
                                </button>

                                <div class="hotline-box">
                                    <p class="small text-muted mb-1">Hỗ trợ kỹ thuật 24/7</p>
                                    <p class="fw-bold mb-0" style="color: var(--primary-green); font-size: 1.15rem;">
                                        <i class="fas fa-phone-alt me-1"></i>1900 6789
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                `);

                $(document).on('click', '#openBooking', function() {
                    const frame = document.getElementById('bookingFlowFrame');
                    frame.src = `dat-lich.html?id=${item.id}&embedded=true`;
                    bookingModal.show();
                });

            } catch (error) {
                console.error("Lỗi tải dịch vụ:", error);
                $('#detailContainer').html('<div class="text-center py-5"><h2 class="text-danger">Không thể kết nối máy chủ</h2><p>Vui lòng kiểm tra lại kết nối mạng.</p></div>');
            }

            // ── RENDER CÁC DỊCH VỤ KHÁC ──
            try {
                const allServices = await API.getServices();
                const others = allServices.filter(s => s.id != serviceId).slice(0, 4);
                const grid = $('#other-services-grid');

                if (others.length === 0) {
                    $('#other-services-section').hide();
                    return;
                }

                others.forEach(s => {
                    let imgSrc = s.image;
                    if (imgSrc && !imgSrc.startsWith('http')) {
                        imgSrc = (imgSrc.indexOf('.') === -1)
                            ? `https://drive.google.com/thumbnail?id=${imgSrc}&sz=w800`
                            : `assets/images/${imgSrc}`;
                    }
                    const priceStr = s.price_m2_min
                        ? s.price_m2_min.toLocaleString() + 'đ/' + (s.area_unit || 'm²')
                        : 'Liên hệ';

                    grid.append(`
                        <div class="col-md-6 col-lg-3">
                            <a href="chi-tiet-dich-vu.html?id=${s.id}" class="text-decoration-none h-100 d-block">
                                <div class="h-100" style="
                                    border-radius:24px;overflow:hidden;background:#fff;
                                    border:1px solid rgba(26,77,46,0.07);
                                    box-shadow:0 4px 20px rgba(26,77,46,0.07);
                                    transition:all 0.4s cubic-bezier(0.165,0.84,0.44,1);
                                    display:flex;flex-direction:column;
                                " onmouseover="this.style.transform='translateY(-8px)';this.style.boxShadow='0 20px 40px rgba(26,77,46,0.13)'"
                                   onmouseout="this.style.transform='';this.style.boxShadow='0 4px 20px rgba(26,77,46,0.07)'">
                                    <div style="position:relative;height:190px;overflow:hidden;flex-shrink:0;">
                                        <img src="${imgSrc}" alt="${s.name}"
                                            style="width:100%;height:100%;object-fit:cover;transition:transform 0.5s ease;"
                                            onmouseover="this.style.transform='scale(1.07)'"
                                            onmouseout="this.style.transform='scale(1)'"
                                            onerror="this.src='assets/vuon-nha-dep.png'">
                                        <div style="
                                            position:absolute;top:10px;left:10px;
                                            background:rgba(255,255,255,0.92);backdrop-filter:blur(6px);
                                            border-radius:50px;padding:3px 10px;
                                            font-size:0.72rem;font-weight:700;color:#1a4d2e;
                                            display:flex;align-items:center;gap:4px;
                                        "><i class="fas fa-star" style="color:#f59e0b;font-size:0.65rem;"></i>${s.rating || '4.9'}</div>
                                    </div>
                                    <div style="padding:16px 18px 18px;display:flex;flex-direction:column;flex:1;">
                                        <h3 style="font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;color:#1a4d2e;margin:0 0 6px;line-height:1.35;">${s.name}</h3>
                                        <p style="font-size:0.8rem;color:#636e72;line-height:1.55;margin:0 0 12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1;">${s.description}</p>
                                        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:auto;">
                                            <span style="background:#e8f3d6;color:#1a4d2e;border-radius:8px;padding:4px 10px;font-size:0.75rem;font-weight:700;">${priceStr}</span>
                                            <span style="width:28px;height:28px;border-radius:50%;background:#1a4d2e;display:flex;align-items:center;justify-content:center;color:#fff;font-size:0.7rem;flex-shrink:0;">
                                                <i class="fas fa-arrow-right"></i>
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </a>
                        </div>
                    `);
                });
            } catch(e) {
                $('#other-services-section').hide();
            }
        });

        // ── PROGRESS BAR KHI CUỘN ──
        $(window).on('scroll', function() {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            $('#scrollProgress').css('width', scrolled + '%');
        });
    </script>
</body>

</html>
